[package]
name = "cryptobud-v4"
version = "4.0.1"
description = "CryptoBud V4 - Stable Crypto Trading App"
authors = ["CryptoBud"]
edition = "2021"

[lib]
name = "cryptobud_v4_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[package.metadata]
icons = [
  "icons/32x32.png",
  "icons/128x128.png",
  "icons/128x128@2x.png",
  "icons/icon.ico",
  "icons/icon.icns",
  "icons/icon.png"
]

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
zeroize = "1"
